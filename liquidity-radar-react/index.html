<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liquidity Radar v5.0 — Crypto Microstructure Terminal</title>
    <meta
      name="description"
      content="Real-time crypto microstructure terminal: order flow, liquidity heatmap, whale tracker, AI analysis and ML forecasts."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The hosts the first paint actually waits on. Only the fonts were hinted
      before, so every API connection began its DNS, TCP and TLS handshake
      only once the bundle had parsed and the first fetch fired. On a link
      that takes ~1s to open a connection that is a second of dead time per
      host, serialised behind the JavaScript. Hinting them lets the handshakes
      run while the bundle is still downloading.

      Binance spot REST and its websocket carry the price, the chart and the
      order book; the futures host carries funding and open interest. The
      others (Yahoo, the news feeds, the other exchanges) are deliberately
      absent — they are on later boot waves, and preconnecting to everything
      would just move the contention rather than remove it.
    -->
    <link rel="preconnect" href="https://api.binance.com" crossorigin />
    <link rel="preconnect" href="https://stream.binance.com" crossorigin />
    <link rel="preconnect" href="https://fapi.binance.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
