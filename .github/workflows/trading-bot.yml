# The testnet trading bot, run by GitHub Actions — free for this public repo,
# no server or PC needed. It runs NON-STOP: each run keeps the bot going for
# 5 h 30 min (a GitHub job may last 6 h), then starts the next run itself, so
# the bot is always connected. GitHub's own cron is unreliable for short jobs
# (runs came ~3 h apart instead of every 15 min); here it is only an hourly
# safety net that restarts the chain if it ever breaks.
#
# The bot ticks every 15 s: mirrors the Binance Demo account for the website,
# manages any open trade, and decides on each newly closed 4-hour candle
# (BOT_INTERVAL) for five markets. EXPLORE: it takes a demo trade whenever the
# model's EV is >= 0.1R after fees and the setup rules pass, without waiting
# for the walk-forward gate (expectancy >= 0.05R, PF >= 1.15, recent blocks
# positive). In gated mode (2026-10-31 to 11-01) no market passed, so the bot
# placed no real trades at all; real fills teach it more than shadow trades.
# The gate verdict is still computed and shown. Bracket 1.5 / 2.25 ATR (1:1.5) with a
# 2-day time exit, entries only at EV >= 0.1R after fees. Chosen by a sweep
# (2026-10-28) of 15m/1h/4h × six brackets × EV bars: 15m had no
# profitable setting and 1h one marginal one; on 4h this setting was positive
# out of sample for BTC (+0.18R/trade, 93 trades) and gold (+0.17R, 70) and
# negative for ETH, SOL and BNB. It learns from
# every closed real and shadow trade and trains a challenger every 4 h or
# every 20 closed trades. Clear a tripped kill switch with npm run reset-risk.
# Requires radar-worker/sql/005_bot_learning.sql and 006_bot_journal.sql (both
# applied by this workflow on every run).
#
# GitHub's runners are in the US, where Binance's main API is blocked; the
# futures testnet host and the public market-data mirror are reachable, and the
# testnet host is the same Demo account. Practice money only.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, BINANCE_API_KEY, BINANCE_API_SECRET
# Stop it: Actions → Trading bot → "…" → Disable workflow, then cancel the
# running run.
name: Trading bot (testnet)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      chained:
        description: Started by the previous run (skips the "already running?" check)
        default: 'false'

permissions:
  contents: read
  actions: write

jobs:
  # Safety-net runs only: do nothing if a bot run is already going or queued.
  check:
    if: ${{ inputs.chained != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      busy: ${{ steps.c.outputs.busy }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow trading-bot.yml --limit 20 \
            --json databaseId,status \
            -q '[.[] | select(.status != "completed") | select(.databaseId != ${{ github.run_id }})] | length')
          echo "other active runs: $n"
          if [ "$n" -gt 0 ]; then echo busy=true >> "$GITHUB_OUTPUT"; else echo busy=false >> "$GITHUB_OUTPUT"; fi

  bot:
    needs: check
    if: ${{ always() && (inputs.chained == 'true' || needs.check.outputs.busy == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Never two bots at once: they would both act on the same account. A run
    # started early waits here until the previous one has handed over.
    concurrency:
      group: trading-bot
      cancel-in-progress: false
    defaults:
      run:
        working-directory: radar-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: radar-worker/package-lock.json
      - run: npm ci --omit=dev
      # Idempotent (IF NOT EXISTS), so applying it on every run is harmless and
      # keeps the schema in step with the code.
      - name: Apply the learning schema
        run: node scripts/apply-sql.mjs sql/005_bot_learning.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply the journal schema
        run: node scripts/apply-sql.mjs sql/006_bot_journal.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: echo "BOT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # Time budget: the bot stops its loop 330 min after it starts; this step
      # is killed at 345 min if a last tick or shutdown hangs (a step timeout
      # FAILS the step, it does not cancel the job, so the hand-over below still
      # runs); the job limit of 355 min leaves room for setup and the hand-over.
      # Never raise BOT_RUN_MINUTES without keeping >= 10 min under the step limit.
      - name: Run the bot (5 h 30 min)
        timeout-minutes: 345
        run: node src/bot.ts
        env:
          BOT_RUN_MINUTES: '330'
          BOT_MODE: explore
          BOT_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XAUUSDT
          BOT_INTERVAL: 4h
          BOT_MIN_EV: '0.1'
          BOT_MIN_MARGIN: '100'
          BOT_SL_ATR: '1.5'
          BOT_TP_ATR: '2.25'
          BOT_HORIZON: '12'
          # 2.25 / 1.5 = 1:1.5 before fees, about 1:1.35 after them on 4h bars.
          BOT_MIN_RR: '1.3'
          BOT_MAX_COST_R: '0.15'
          BOT_COOLDOWN_MIN: '240'
          BOT_MAX_OPEN: '4'
          BOT_MAX_TRADES_DAY: '10'
          BOT_SHADOW: '1'
          BOT_SHADOW_MAX_OPEN: '1'
          BOT_LEARN_EVERY_MIN: '240'
          BOT_LEARN_EVERY_TRADES: '20'
          FUTURES_BASE: https://testnet.binancefuture.com
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      # Hand over, even if the bot step failed or hit its step timeout — but not
      # if someone cancelled the run, and not after a crash on startup (that
      # would just loop; the hourly safety net retries instead).
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date +%s) - BOT_STARTED ))
          echo "bot ran ${ran}s"
          if [ "$ran" -lt 600 ]; then echo "too short, not chaining; the hourly run will retry"; exit 0; fi
          gh workflow run trading-bot.yml -R "$GITHUB_REPOSITORY" --ref master -f chained=true
