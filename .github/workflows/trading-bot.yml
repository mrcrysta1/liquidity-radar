# The testnet trading bot, run by GitHub Actions — free for this public repo,
# no server or PC needed. It runs NON-STOP: each run keeps the bot going for
# 5 h 30 min (a GitHub job may last 6 h), then starts the next run itself, so
# the bot is always connected. GitHub's own cron is unreliable for short jobs
# (runs came ~3 h apart instead of every 15 min); here it is only an hourly
# safety net that restarts the chain if it ever breaks.
#
# The bot ticks every 15 s: mirrors the Binance Demo account for the website,
# manages any open trade, and decides on each newly closed 4-hour candle
# (BOT_INTERVAL) for 24 markets (BOT_SYMBOLS; any the futures testnet does not
# trade is left out at startup with a warning). Bars are cached between ticks
# and fetched once per market per new candle. Markets act in alphabetical
# order, so when several real entries on one bar compete for the heat cap the
# tie-break is the symbol name (as in the research portfolio).
#
# STRATEGIES (BOT_STRATEGIES, radar-worker/src/bot/strategies.ts): every
# strategy decides on every bar; a live one's signal is a real trade if every
# rule passes (one real position per market, first by priority), any other
# signal is that strategy's shadow trade. Health (src/bot/health.ts) demotes a
# live strategy whose rolling 30-trade expectancy or drawdown leaves its
# research bands, and promotes it back only on 30 new good shadow trades.
# Probation (rolling 30 under p5 or drawdown over p95) halves its risk per trade.
#   f1  live, all 24 markets — bands: rolling 30 p5 -0.33R / p1 -0.43R,
#       100-trade drawdown p95 22.1R / p99 27.7R (expected ~+0.10R).
#   c6  shadow, all 24 markets: research strategy C6 — F1's entries, taken
#       only when a GBDT model (FEATURES_V2 at the signal bar, seed 7) rates
#       P(F1 net R > 0) at least its training base rate; exits as F1. The model
#       is trained in the background on every market's whole history (F1
#       trades closed >= 7 days before), kept in bot_state 'c6:model' and
#       retrained every 182 days — not on every run; C6 decides nothing until
#       it exists. Research 2021+: +0.218R, PF 1.62, Sharpe 1.10 (F1 0.76).
#       Bands: rolling 30 p5 -0.32R / p1 -0.45R, drawdown p95 21.4R / p99 26.7R.
#   f1x shadow, all 24 markets: F1 with the rule exit on the prior 15-bar low
#       instead of 10 (research round 3); everything else as F1. Its shadow
#       trades are independent of F1's. Bands (exitN 15, dev + HOLD-NEW):
#       rolling 30 p5 -0.35R / p1 -0.45R, drawdown p95 23.2R / p99 29.3R.
#   c2  shadow, all 24 markets: research strategy C2, the bear-market mirror of
#       F1 (short when BTC and the market are below EMA(300) and the close
#       breaks the 20-bar low; 3 ATR stop, 4 ATR trail; exit above the 10-bar
#       high or EMA(300)). Thin edge (dev +0.047R, PF 1.15, t = 1.08): paper
#       only; bands p5 -0.38R / p1 -0.47R, drawdown p95 26.1R / p99 31.3R.
#   ml  shadow, BTC/ETH/SOL/BNB only: the model's training, walk-forward and
#       challengers are heavy, so they run on those four markets alone.
#
# REAL (demo) TRADES: research strategy F1 (f1:live,
# radar-worker/src/bot/strategy.ts), long only, on all 24 markets:
#   entry  4h close > EMA(300) and > the highest high of the previous 20 bars
#          → market buy right after the close
#   stop   entry − 3 × ATR14, exchange-side; no take-profit, no time exit
#   trail  each 4h close: stop = max(stop, highest high since entry − 4 × ATR14)
#   exit   4h close < lowest low of the previous 10 bars, or ≤ EMA(300) → market
#   risk   0.5%/trade at the initial stop; daily halt, drawdown kill switch and
#          the heat cap below apply (not the model's walk-forward gate)
# Research (fees, slippage, funding): 2019–Jan 2026 +0.376R/trade, PF 2.12;
# sealed holdout Feb–Nov 2026 +0.179R/trade, PF 1.48, +4.5%, 63 trades — not
# significant (t = 0.66). Round 2: on 10 markets never used in development
# (HOLD-NEW: APT ATOM DOGE FIL LINK LTC OP SUI TRX XRP), 2019–Jan 2026, 834
# trades, +0.169R/trade, PF 1.45, t ≈ 2.2. XAUUSDT is dropped: too little
# history for F1.
#
# THE MODEL keeps running beside it as SHADOW trades only (no orders), so
# calibration and the challenger cycle continue. Its settings below (bracket,
# EV bar, R:R, cooldown) now shape only those shadow trades. Before trend mode:
# HYBRID: a demo trade only on a market whose
# walk-forward gate passes (expectancy >= 0.05R, PF >= 1.15, recent blocks
# positive), at EV >= 0.1R after fees with the setup rules passing, and only
# while open risk stays under the portfolio heat cap (1.5% of equity per
# direction, 2% in total: BTC/ETH/SOL/BNB move ~0.9 together, so same-side
# trades on one bar are one big bet). Every other signal is a shadow trade, so
# it learns from all of them at no cost. (Explore mode, 2026-11-01, traded
# without a proven edge; gated mode before it placed no trades at all.) Bracket 1.5 / 2.25 ATR (1:1.5) with a
# 2-day time exit, entries only at EV >= 0.1R after fees. Chosen by a sweep
# (2026-10-28) of 15m/1h/4h × six brackets × EV bars: 15m had no
# profitable setting and 1h one marginal one; on 4h this setting was positive
# out of sample for BTC (+0.18R/trade, 93 trades) and gold (+0.17R, 70) and
# negative for ETH, SOL and BNB. It learns from
# every closed real and shadow trade and trains a challenger every 4 h or
# every 20 closed trades. Clear a tripped kill switch with npm run reset-risk.
# Requires radar-worker/sql/005_bot_learning.sql, 006_bot_journal.sql,
# 007_bot_trend.sql and 008_bot_strategies.sql (all applied by this workflow
# on every run).
#
# GitHub's runners are in the US, where Binance's main API is blocked; the
# futures testnet host and the public market-data mirror are reachable, and the
# testnet host is the same Demo account. Practice money only.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, BINANCE_API_KEY, BINANCE_API_SECRET
# Stop it: Actions → Trading bot → "…" → Disable workflow, then cancel the
# running run.
name: Trading bot (testnet)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      chained:
        description: Started by the previous run (skips the "already running?" check)
        default: 'false'

permissions:
  contents: read
  actions: write

jobs:
  # Safety-net runs only: do nothing if a bot run is already going or queued.
  check:
    if: ${{ inputs.chained != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      busy: ${{ steps.c.outputs.busy }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow trading-bot.yml --limit 20 \
            --json databaseId,status \
            -q '[.[] | select(.status != "completed") | select(.databaseId != ${{ github.run_id }})] | length')
          echo "other active runs: $n"
          if [ "$n" -gt 0 ]; then echo busy=true >> "$GITHUB_OUTPUT"; else echo busy=false >> "$GITHUB_OUTPUT"; fi

  bot:
    needs: check
    if: ${{ always() && (inputs.chained == 'true' || needs.check.outputs.busy == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Never two bots at once: they would both act on the same account. A run
    # started early waits here until the previous one has handed over.
    concurrency:
      group: trading-bot
      cancel-in-progress: false
    defaults:
      run:
        working-directory: radar-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: radar-worker/package-lock.json
      - run: npm ci --omit=dev
      # Idempotent (IF NOT EXISTS), so applying it on every run is harmless and
      # keeps the schema in step with the code.
      - name: Apply the learning schema
        run: node scripts/apply-sql.mjs sql/005_bot_learning.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply the journal schema
        run: node scripts/apply-sql.mjs sql/006_bot_journal.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply the trend-strategy schema
        run: node scripts/apply-sql.mjs sql/007_bot_trend.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply the multi-strategy schema
        run: node scripts/apply-sql.mjs sql/008_bot_strategies.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: echo "BOT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # Time budget: the bot stops its loop 330 min after it starts; this step
      # is killed at 345 min if a last tick or shutdown hangs (a step timeout
      # FAILS the step, it does not cancel the job, so the hand-over below still
      # runs); the job limit of 355 min leaves room for setup and the hand-over.
      # Never raise BOT_RUN_MINUTES without keeping >= 10 min under the step limit.
      - name: Run the bot (5 h 30 min)
        timeout-minutes: 345
        run: node src/bot.ts
        env:
          BOT_RUN_MINUTES: '330'
          # Strategies in priority order, id:state@markets (';' between them):
          # F1 places the real orders everywhere, C6 (F1 filtered by its GBDT)
          # and C2 paper-trade everywhere, the model paper-trades on the four
          # majors only. A live strategy
          # that leaves its health bands is demoted to shadow (and promoted
          # back after 30 good shadow trades); bot_state 'strategy:<id>'.
          # Hybrid keeps the portfolio heat cap (1.5% per side, 2% total).
          BOT_STRATEGIES: 'f1:live@*;c6:shadow@*;f1x:shadow@*;c2:shadow@*;ml:shadow@BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT'
          BOT_MODE: hybrid
          BOT_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,AAVEUSDT,ADAUSDT,ARBUSDT,AVAXUSDT,BCHUSDT,DOTUSDT,ETCUSDT,INJUSDT,NEARUSDT,UNIUSDT,APTUSDT,ATOMUSDT,DOGEUSDT,FILUSDT,LINKUSDT,LTCUSDT,OPUSDT,SUIUSDT,TRXUSDT,XRPUSDT
          BOT_INTERVAL: 4h
          BOT_MIN_EV: '0.1'
          BOT_MIN_MARGIN: '100'
          BOT_SL_ATR: '1.5'
          BOT_TP_ATR: '2.25'
          BOT_HORIZON: '12'
          # 2.25 / 1.5 = 1:1.5 before fees, about 1:1.35 after them on 4h bars.
          BOT_MIN_RR: '1.3'
          BOT_MAX_COST_R: '0.15'
          BOT_COOLDOWN_MIN: '240'
          BOT_MAX_OPEN: '4'
          BOT_MAX_TRADES_DAY: '10'
          # Portfolio heat: three 0.5% trades per side, as in the research. The
          # small margin over 1.5% / 2% is for stops rounded to the tick size,
          # which can push one trade's risk a hair over 0.5%.
          BOT_MAX_SIDE_RISK: '0.016'
          BOT_MAX_TOTAL_RISK: '0.021'
          BOT_SHADOW: '1'
          # One decision per bar, each shadow open at most BOT_HORIZON bars:
          # 13 per market leaves room to shadow every signal.
          BOT_SHADOW_MAX_OPEN: '13'
          BOT_LEARN_EVERY_MIN: '240'
          BOT_LEARN_EVERY_TRADES: '20'
          FUTURES_BASE: https://testnet.binancefuture.com
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      # Hand over, even if the bot step failed or hit its step timeout — but not
      # if someone cancelled the run, and not after a crash on startup (that
      # would just loop; the hourly safety net retries instead).
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date +%s) - BOT_STARTED ))
          echo "bot ran ${ran}s"
          if [ "$ran" -lt 600 ]; then echo "too short, not chaining; the hourly run will retry"; exit 0; fi
          gh workflow run trading-bot.yml -R "$GITHUB_REPOSITORY" --ref master -f chained=true
